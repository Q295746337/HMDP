<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>AI智能客服 - 伊岐优选</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">
  <style type="text/css">
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #f2f3f5;
      font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }

    #app {
      height: 100%;
      display: flex;
      justify-content: center;
    }

    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 0 12px rgba(0, 0, 0, .06);
    }

    /* ===== 头部 ===== */
    .chat-header {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: linear-gradient(135deg, #ff6633, #ff8a5c);
      color: #fff;
    }

    .back-btn {
      font-size: 20px;
      cursor: pointer;
      margin-right: 10px;
      padding: 4px;
    }

    .ai-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-right: 10px;
    }

    .ai-info {
      flex: 1;
    }

    .ai-name {
      font-size: 16px;
      font-weight: 600;
    }

    .ai-status {
      font-size: 12px;
      opacity: .9;
    }

    .clear-btn {
      font-size: 13px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .2);
      transition: background .2s;
    }

    .clear-btn:hover {
      background: rgba(255, 255, 255, .35);
    }

    /* ===== 消息区 ===== */
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      background: #f7f8fa;
    }

    .welcome {
      text-align: center;
      padding-top: 40px;
    }

    .welcome .big-icon {
      font-size: 56px;
      margin-bottom: 12px;
    }

    .welcome .welcome-title {
      font-size: 17px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .welcome .welcome-desc {
      font-size: 13px;
      color: #999;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .quick-chip {
      font-size: 13px;
      color: #ff6633;
      background: #fff;
      border: 1px solid #ffd9cc;
      border-radius: 16px;
      padding: 7px 14px;
      cursor: pointer;
      transition: all .2s;
    }

    .quick-chip:hover {
      background: #ff6633;
      color: #fff;
    }

    .msg-row {
      display: flex;
      margin-bottom: 16px;
      align-items: flex-start;
    }

    .msg-row .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .msg-row.user {
      flex-direction: row-reverse;
    }

    .msg-row.user .avatar {
      background: #ff6633;
      margin-left: 10px;
    }

    .msg-row.ai .avatar {
      background: #fff;
      border: 1px solid #eee;
      margin-right: 10px;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
      border-radius: 12px;
      white-space: normal;
    }

    .msg-row.user .bubble {
      background: #ff6633;
      color: #fff;
      border-top-right-radius: 2px;
    }

    .msg-row.ai .bubble {
      background: #fff;
      color: #333;
      border-top-left-radius: 2px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .05);
    }

    .bubble ol, .bubble ul {
      margin: 6px 0 6px 18px;
    }

    .bubble li {
      margin-bottom: 4px;
    }

    .bubble strong {
      color: inherit;
    }

    /* 打字中动画 */
    .typing-dots {
      display: flex;
      gap: 5px;
      padding: 4px 2px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ccc;
      animation: blink 1.2s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {
      0%, 60%, 100% {
        opacity: .3;
      }
      30% {
        opacity: 1;
      }
    }

    /* ===== 输入区 ===== */
    .chat-footer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #eee;
      background: #fff;
    }

    .chat-footer .el-textarea {
      flex: 1;
    }

    .chat-footer .el-textarea__inner {
      border-radius: 10px;
      resize: none;
    }

    .send-btn {
      height: 36px;
      border-radius: 18px;
      background: #ff6633;
      border-color: #ff6633;
    }

    .send-btn:hover, .send-btn:focus {
      background: #ff7a4d;
      border-color: #ff7a4d;
    }

    /* ===== 历史会话 ===== */
    .history-item {
      padding: 12px 14px;
      border-bottom: 1px solid #f2f3f5;
      cursor: pointer;
      transition: background .15s;
    }

    .history-item:hover {
      background: #fafafa;
    }

    .history-title {
      font-size: 14px;
      color: #333;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-sub {
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="chat-container">
    <!-- 头部 -->
    <div class="chat-header">
      <div class="back-btn" @click="backHome"><i class="el-icon-arrow-left"></i></div>
      <div class="ai-avatar">🤖</div>
      <div class="ai-info">
        <div class="ai-name">AI智能客服</div>
        <div class="ai-status">在线 · 可查商家/优惠券/预约到店</div>
      </div>
      <div class="clear-btn" @click="newChat"><i class="el-icon-refresh"></i> 新对话</div>
      <div class="clear-btn" style="margin-left:6px" @click="showHistory"><i class="el-icon-time"></i> 历史</div>
    </div>

    <!-- 消息区 -->
    <div class="chat-body" ref="body">
      <!-- 欢迎页(无消息时展示) -->
      <div class="welcome" v-if="messages.length === 0">
        <div class="big-icon">🍽️</div>
        <div class="welcome-title">您好，我是伊岐优选的AI顾问</div>
        <div class="welcome-desc">
          我可以帮您查询商家信息、优惠券<br>
          预约到店消费，也可以为您推荐美食哦～
        </div>
        <div class="quick-chips">
          <div class="quick-chip" v-for="q in quickQuestions" :key="q" @click="quickSend(q)">{{q}}</div>
        </div>
      </div>

      <!-- 消息列表 -->
      <div class="msg-row" :class="m.role" v-for="(m, i) in messages" :key="i">
        <div class="avatar">{{m.role === 'user' ? '😊' : '🤖'}}</div>
        <div class="bubble" v-html="renderMarkdown(m.content)"></div>
      </div>

      <!-- 正在思考 -->
      <div class="msg-row ai" v-if="sending">
        <div class="avatar">🤖</div>
        <div class="bubble">
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="chat-footer">
      <el-input
          type="textarea"
          :rows="2"
          v-model="input"
          placeholder="请输入您的问题，Enter发送 / Shift+Enter换行"
          @keydown.native.enter.exact.prevent="send">
      </el-input>
      <el-button class="send-btn" type="primary" @click="send" :disabled="sending" :loading="sending">
        {{sending ? '回复中' : '发送'}}
      </el-button>
    </div>
    <!-- 历史会话抽屉 -->
    <el-drawer title="历史会话" :visible.sync="drawerVisible" size="78%">
      <div v-loading="loadingHistory" style="min-height:120px">
        <el-empty v-if="!loadingHistory && sessions.length === 0" description="暂无历史会话"></el-empty>
        <div v-for="s in sessions" :key="s.memoryId" class="history-item" @click="openSession(s)">
          <div class="history-title">{{s.firstMessage || '(空会话)'}}</div>
          <div class="history-sub">
            {{s.updateTime ? formatTime(s.updateTime) : ''}} · {{s.messageCount}} 条消息
          </div>
        </div>
      </div>
    </el-drawer>
  </div>
</div>

<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<!-- 公共工具:axios统一baseURL(/api)与token拦截器,未登录401自动跳转登录页 -->
<script src="./js/common.js"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      input: "",            // 输入框内容
      messages: [],         // 消息列表 [{role: 'user'|'ai', content: ''}]
      sending: false,       // 是否正在等待AI回复
      quickQuestions: [
        "想吃火锅，有什么店推荐吗？",
        "帮我查一下103茶餐厅的优惠券",
        "我想预约到店消费",
        "杭州有什么好吃的推荐吗？"
      ],
      drawerVisible: false,  // 历史抽屉
      loadingHistory: false, // 历史加载中
      sessions: [],          // 历史会话列表
      memoryId: "",          // 当前会话标识(后端生成,绑定登录用户)
    },
    created() {
      // 记忆由后端按登录用户自动绑定,打开页面自动恢复最近一次会话
      this.loadSessions(true);
    },
    methods: {
      backHome() {
        location.href = "/index.html";
      },
      // 点击快捷问题
      quickSend(q) {
        this.input = q;
        this.send();
      },
      // 开启新对话:后端生成新会话标识,清空页面
      newChat() {
        axios.post("/chat/session/new")
            .then(({data}) => {
              this.memoryId = data;
              this.messages = [];
              this.$message.success("已开启新对话");
            })
            .catch(err => {
              this.$message.error("开启新对话失败: " + err);
            });
      },
      // 打开历史会话列表
      showHistory() {
        this.drawerVisible = true;
        this.loadSessions(false);
      },
      // 加载历史会话列表(autoRestore=true时自动恢复最近一次会话)
      loadSessions(autoRestore) {
        this.loadingHistory = true;
        axios.get("/chat/history/list")
            .then(({data}) => {
              this.sessions = data || [];
              if (autoRestore && this.sessions.length > 0) {
                // 页面打开时自动加载最近一次会话,AI上下文无缝衔接
                this.openSession(this.sessions[0]);
              }
            })
            .catch(err => {
              this.$message.error("加载历史失败: " + err);
            })
            .finally(() => {
              this.loadingHistory = false;
            });
      },
      // 打开某个历史会话并加载消息(记忆由后端按登录用户绑定)
      openSession(s) {
        axios.get("/chat/history/" + encodeURIComponent(s.memoryId))
            .then(({data}) => {
              this.messages = (data || []).map(m => ({
                role: m.role,
                content: m.content
              }));
              this.memoryId = s.memoryId;
              this.drawerVisible = false;
              this.scrollBottom();
            })
            .catch(err => {
              this.$message.error("加载会话失败: " + err);
            });
      },
      // 时间格式化
      formatTime(t) {
        if (!t) {
          return "";
        }
        const d = new Date(t);
        const pad = n => (n < 10 ? "0" + n : "" + n);
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
            + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
      },
      // 发送消息
      async send() {
        const text = this.input.trim();
        if (!text || this.sending) {
          return;
        }
        // 没有会话时(如历史为空)先自动开启一个新对话
        if (!this.memoryId) {
          try {
            const resp = await axios.post("/chat/session/new");
            this.memoryId = resp.data;
          } catch (err) {
            this.$message.error("开启对话失败: " + err);
            return;
          }
        }
        this.input = "";
        this.messages.push({role: "user", content: text});
        const aiMsg = {role: "ai", content: ""};
        this.messages.push(aiMsg);
        this.sending = true;
        this.scrollBottom();
        try {
          // 记忆由后端按登录用户+会话绑定(common.js自动带token)
          const url = "/api/chat?memoryId=" + encodeURIComponent(this.memoryId)
              + "&message=" + encodeURIComponent(text);
          const resp = await fetch(url, {
            headers: {"authorization": sessionStorage.getItem("token") || ""}
          });
          if (!resp.ok || !resp.body) {
            throw new Error("HTTP " + resp.status);
          }
          // 后端为流式返回,逐段读取并显示
          const reader = resp.body.getReader();
          const decoder = new TextDecoder("utf-8");
          while (true) {
            const {done, value} = await reader.read();
            if (done) {
              break;
            }
            aiMsg.content += decoder.decode(value, {stream: true});
            this.scrollBottom();
          }
          if (!aiMsg.content) {
            aiMsg.content = "（未收到回复，请稍后再试）";
          }
        } catch (e) {
          aiMsg.content = "抱歉，服务出错了：" + e.message;
        } finally {
          this.sending = false;
          this.scrollBottom();
        }
      },
      // 滚动到底部
      scrollBottom() {
        this.$nextTick(() => {
          const el = this.$refs.body;
          if (el) {
            el.scrollTop = el.scrollHeight;
          }
        });
      },
      // 简易Markdown渲染:支持**加粗**、数字/符号列表、换行
      renderMarkdown(text) {
        if (!text) {
          return "";
        }
        // 1.转义HTML,防注入
        const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        // 2.行内加粗
        const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        // 3.按行处理列表
        const lines = esc.split("\n");
        let html = "";
        let inUl = false, inOl = false;
        const closeLists = () => {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (inOl) { html += "</ol>"; inOl = false; }
        };
        for (const line of lines) {
          const olMatch = line.match(/^\s*(\d+)[.、]\s*(.*)/);
          const ulMatch = line.match(/^\s*[-•*]\s+(.*)/);
          if (olMatch) {
            closeLists();
            if (!inOl) { html += "<ol>"; inOl = true; }
            html += "<li>" + inline(olMatch[2]) + "</li>";
          } else if (ulMatch) {
            closeLists();
            if (!inUl) { html += "<ul>"; inUl = true; }
            html += "<li>" + inline(ulMatch[1]) + "</li>";
          } else {
            closeLists();
            if (line.trim() === "") {
              html += "<br>";
            } else {
              html += "<div>" + inline(line) + "</div>";
            }
          }
        }
        closeLists();
        return html;
      },
    }
  })
</script>
</body>
</html>
